name: Personal build

# Builds a self-signed arm64-v8a APK. Nothing is posted to any channel.
# Secrets: NAGRAM_KEYSTORE_BASE64 (the signing keystore, base64) and
# LOCAL_PROPERTIES (base64 of KEYSTORE_PASS / ALIAS_NAME / ALIAS_PASS /
# TELEGRAM_APP_ID / TELEGRAM_APP_HASH).
on:
  push:
    branches:
      - album-thumbs
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "5G"
      CCACHE_HARDLINK: "true"
      NATIVE_TARGET: arm64-v8a
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          append-timestamp: false
          key: native-personal-${{ github.job }}
          max-size: 5G
      - name: Install NDK
        run: |
          echo "y" | sdkmanager --install "ndk;27.2.12479018" --sdk_root=${ANDROID_SDK_ROOT} &> /dev/null
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/27.2.12479018" >> local.properties
      - name: Configure Gradle
        run: |
          sed -i "s/2000000000000/$(date +%s%N | cut -c1-13)/g" gradle.properties
      - name: Restore signing keystore
        env:
          NAGRAM_KEYSTORE_BASE64: ${{ secrets.NAGRAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$NAGRAM_KEYSTORE_BASE64" ]; then
            echo "::error::Secret NAGRAM_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$NAGRAM_KEYSTORE_BASE64" | base64 -d > TMessagesProj/release.keystore
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Release Build
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "::error::Secret LOCAL_PROPERTIES is not set."
            exit 1
          fi
          ./gradlew TMessagesProj:assembleRelease --build-cache --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: Nagram-arm64-v8a
          path: TMessagesProj/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error
